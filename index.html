<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloads</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --line: #dde1e6;
      --accent: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b;
        --card: #1c2025;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --line: #2c3239;
        --accent: #5b9dff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    p.sub { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
    li a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .9rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
    }
    li a:hover { border-color: var(--accent); }
    li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .name { font-weight: 600; }
    .action { color: var(--accent); font-size: .9rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Downloads</h1>
    <p class="sub">Tap a file to download it.</p>

    <!-- Edit the href and name of each link below. Add or remove <li> items as needed. -->
    <ul>
      <li><a href="file/app1.apk" download><span class="name">App 1</span><span class="action">Download</span></a></li>
      <li><a href="file/app2.apk" download><span class="name">App 2</span><span class="action">Download</span></a></li>
      <li><a href="file/app3.apk" download><span class="name">App 3</span><span class="action">Download</span></a></li>
      <li><a href="file/app4.apk" download><span class="name">App 4</span><span class="action">Download</span></a></li>
      <li><a href="file/app5.apk" download><span class="name">App 5</span><span class="action">Download</span></a></li>
      <li><a href="file/app6.apk" download><span class="name">App 6</span><span class="action">Download</span></a></li>
      <li><a href="file/app7.apk" download><span class="name">App 7</span><span class="action">Download</span></a></li>
      <li><a href="file/app8.apk" download><span class="name">App 8</span><span class="action">Download</span></a></li>
      <li><a href="file/app9.apk" download><span class="name">App 9</span><span class="action">Download</span></a></li>
      <li><a href="file/app10.apk" download><span class="name">App 10</span><span class="action">Download</span></a></li>
      <li><a href="file/app11.apk" download><span class="name">App 11</span><span class="action">Download</span></a></li>
      <li><a href="file/app12.apk" download><span class="name">App 12</span><span class="action">Download</span></a></li>
    </ul>
  </main>
</body>
</html>
